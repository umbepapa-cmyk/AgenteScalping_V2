[IB]
# Indirizzo IP di IB Gateway (127.0.0.1 se è sulla stessa macchina)
host = 127.0.0.1
# Porta TWS Paper Trading (4002), cambiala in 7496 per Live o 4001/4002 se passi a IB Gateway
port = 4002
# Client ID univoco per questa connessione
client_id = 1
# Ambiente di trading (PAPER o LIVE)
environment = PAPER

[STRATEGY]
# Versione della strategia
version = v1_scalping
# Simbolo dello strumento da tradare
symbol = BTC
# Tipo di strumento (CRYPTO per i digital asset quotati su IB)
sec_type = CRYPTO
# Exchange (PAXOS per BTC/ETH su IB, oppure GDAX per altre venue)
exchange = PAXOS
# Valuta
currency = USD
# Quantità per ogni trade (crypto consente quantità decimali)
quantity = 0.01
# Prezzo di Take Profit (in pips)
take_profit_pips = 0.0010
# Prezzo di Stop Loss (in pips)
stop_loss_pips = 0.0005
# Moltiplicatori dinamici basati sull'ATR per TP/SL
atr_tp_multiplier = 1.5
atr_sl_multiplier = 1.0
# Numero massimo di trade contemporanei
max_concurrent_trades = 1
# Tempo minimo tra due ingressi consecutivi (secondi)
cooldown_seconds = 45
# Durata massima di mantenimento dello slot (secondi)
max_hold_seconds = 180
# Filtri minimi su volatilità e momentum per scalping
min_atr = 5
min_momentum = 2
# Esecuzione automatica ordini quando AI decide BUY/SELL (True/False)
auto_trade = True

[CRYPTO_FEED]
# Abilita un feed esterno (es. Binance) per avere uno snapshot in tempo quasi reale
enabled = True
# Provider supportati: binance (pubblico), coinbase (in roadmap)
provider = binance
# Lista di coppie (separate da virgola) attese dal provider selezionato
symbols = BTCUSDT,ETHUSDT
label = CRYPTO FEED

[FOREX_FEED]
# Feed di emergenza basato sulle coppie fiat di Binance (replica i prezzi spot USD)
enabled = True
provider = binance
symbols = EURUSDT,GBPUSDT,USDTRY
label = FOREX FEED

[NEWS]
# Abilita o disabilita l'integrazione con le news macro/finanziarie
enabled = True
# Nome della variabile d'ambiente che contiene la chiave API del provider
api_key_env = NEWSAPI_KEY
# Provider supportati: newsapi (default) oppure marketaux
provider = newsapi
# Query di ricerca (usa "auto" per derivarla dal simbolo configurato)
query = auto
# Facoltativo: puoi usare template come "{pair},geopolitics" o "{symbol}/{currency},forex"
# segnaposto disponibili: {symbol}, {currency}, {pair}, {sec_type}
# Lingua delle news (codice ISO, es. en, it)
language = en
# Numero massimo di articoli da includere nel contesto
max_articles = 5
# Intervallo di aggiornamento minimo (minuti)
refresh_minutes = 10
# Orizzonte temporale dei dati richiesti al provider (minuti)
lookback_minutes = 120